<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6fb">
    <title>小刘听写 · 语音合成测试</title>
    <style>
        :root {
            --bg: #f5f6fb;
            --card: #ffffff;
            --ink: #1f2430;
            --muted: #6b7280;
            --line: #e5e7ef;
            --accent: #6b5bd2;
            --ok: #1f8a5c;
            --err: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        main { max-width: 560px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 4px 0 4px; }
        .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }
        label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
        label:first-child { margin-top: 0; }
        input, select {
            width: 100%;
            padding: 11px 12px;
            font-size: 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfbfe;
            color: var(--ink);
        }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 12px;
        }
        button.ghost {
            margin-top: 8px;
            color: var(--accent);
            background: #eeebfb;
        }
        button:disabled { opacity: .6; }
        audio { width: 100%; margin-top: 12px; }
        #status { margin: 0; font-weight: 600; }
        #status.ok { color: var(--ok); }
        #status.err { color: var(--err); }
        .meta { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
        pre {
            margin: 8px 0 0;
            padding: 10px;
            background: #f7f7fc;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #384152;
            max-height: 260px;
            overflow: auto;
        }
    </style>
</head>
<body>
<main>
    <h1>语音合成测试</h1>
    <p class="sub">验证 Render 后端调用 Edge TTS 后，手机能否播放音频。</p>

    <section class="card">
        <label for="server">后端地址</label>
        <input id="server" value="https://lzy-fastapi.onrender.com" autocomplete="off">

        <label for="text">朗读文本（最多 50 字）</label>
        <input id="text" value="认真" maxlength="50" autocomplete="off">

        <label for="voice">音色</label>
        <select id="voice">
            <option value="zh-CN-XiaoxiaoNeural">晓晓（女声，推荐）</option>
            <option value="zh-CN-YunxiNeural">云希（男声）</option>
            <option value="zh-CN-XiaoyiNeural">晓伊（女声）</option>
            <option value="zh-CN-YunjianNeural">云健（男声，偏解说）</option>
        </select>

        <label for="volume">音量</label>
        <select id="volume">
            <option value="0">默认（不增益）</option>
            <option value="50" selected>提高 50%（推荐）</option>
            <option value="100">提高 100%（可能失真）</option>
        </select>

        <button id="speakBtn" type="button">合成并播放</button>
        <button id="copyBtn" class="ghost" type="button">复制诊断</button>

        <audio id="audio" controls preload="none"></audio>

        <p id="status" class="meta">等待测试</p>
        <p id="meta" class="meta"></p>
        <pre id="detail">尚未请求。首次调用可能受服务器冷启动影响。</pre>
    </section>

    <section class="card">
        <pre id="env"></pre>
    </section>
</main>

<script>
(function () {
    'use strict';

    var serverEl = document.getElementById('server');
    var textEl = document.getElementById('text');
    var voiceEl = document.getElementById('voice');
    var volumeEl = document.getElementById('volume');
    var speakBtn = document.getElementById('speakBtn');
    var copyBtn = document.getElementById('copyBtn');
    var audio = document.getElementById('audio');
    var statusEl = document.getElementById('status');
    var metaEl = document.getElementById('meta');
    var detailEl = document.getElementById('detail');
    var envEl = document.getElementById('env');

    var lastRequestUrl = '';
    var lastResult = '尚未请求';
    var objectUrl = null;

    function setStatus(text, tone) {
        statusEl.textContent = text;
        statusEl.className = 'meta' + (tone ? ' ' + tone : '');
    }

    function showEnv() {
        envEl.textContent = [
            'UA：' + navigator.userAgent,
            '协议：' + location.protocol,
            '页面：' + (document.hidden ? '后台' : '前台'),
            'Audio 支持：' + (typeof window.Audio === 'function' ? '是' : '否')
        ].join('\n');
    }

    function currentUrl() {
        var base = String(serverEl.value || '').trim().replace(/\/+$/, '');
        return base + '/api/tts/speak?text=' + encodeURIComponent(textEl.value.trim()) +
            '&voice=' + encodeURIComponent(voiceEl.value) +
            '&volume=' + encodeURIComponent(volumeEl.value);
    }

    speakBtn.addEventListener('click', function () {
        var text = textEl.value.trim();
        if (!text) {
            setStatus('请先输入文本', 'err');
            return;
        }
        if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
        }
        audio.removeAttribute('src');

        var url = currentUrl();
        lastRequestUrl = url;
        var started = performance.now();
        speakBtn.disabled = true;
        setStatus('请求中…（冷启动可能需要 30 秒）');
        metaEl.textContent = '';
        detailEl.textContent = url;

        fetch(url, { cache: 'no-store' }).then(function (response) {
            var elapsed = Math.round(performance.now() - started);
            if (!response.ok) {
                return response.text().then(function (body) {
                    throw new Error('HTTP ' + response.status + ' · ' + body.slice(0, 300));
                });
            }
            return response.blob().then(function (blob) {
                if (!blob.size) throw new Error('返回的音频为空');
                objectUrl = URL.createObjectURL(blob);
                audio.src = objectUrl;
                setStatus('已获取音频，耗时 ' + elapsed + ' ms', 'ok');
                metaEl.textContent = '大小 ' + Math.round(blob.size / 1024) + ' KB · 类型 ' + (blob.type || '未知');
                lastResult = '成功：' + elapsed + ' ms，' + Math.round(blob.size / 1024) + ' KB';
                var playPromise = audio.play();
                if (playPromise && playPromise.catch) {
                    playPromise.catch(function () {
                        setStatus('音频已就绪，请点击播放器播放', 'ok');
                    });
                }
            });
        }).catch(function (error) {
            var elapsed = Math.round(performance.now() - started);
            setStatus('请求失败', 'err');
            metaEl.textContent = '耗时 ' + elapsed + ' ms';
            detailEl.textContent = '请求地址：' + url + '\n错误：' + error.message +
                '\n提示：网络错误可能是 CORS、跨域超时或后端未部署。';
            lastResult = '失败：' + error.message;
        }).then(function () {
            speakBtn.disabled = false;
        });
    });

    audio.addEventListener('playing', function () {
        setStatus('正在播放', 'ok');
    });
    audio.addEventListener('error', function () {
        setStatus('播放器无法播放该音频', 'err');
    });

    copyBtn.addEventListener('click', function () {
        var content = [
            '小刘听写·语音合成测试',
            '时间：' + new Date().toLocaleString(),
            '结果：' + lastResult,
            '请求：' + (lastRequestUrl || '尚未请求'),
            '音色：' + voiceEl.options[voiceEl.selectedIndex].text + ' · 音量：' + volumeEl.options[volumeEl.selectedIndex].text,
            envEl.textContent,
            '详情：' + detailEl.textContent
        ].join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(content).then(function () {
                setStatus('诊断信息已复制', 'ok');
            }).catch(function () {
                window.prompt('请长按复制：', content);
            });
        } else {
            window.prompt('请长按复制：', content);
        }
    });

    showEnv();
    document.addEventListener('visibilitychange', showEnv);
})();
</script>
</body>
</html>
