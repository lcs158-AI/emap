<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON 地图编辑器</title>
    <link rel="stylesheet" href="css/jsoncanvas.css">
</head>
<body>
    <h1>GeoJSON 地图编辑器</h1>
    <div id="map-container">
        <div id="map">
            <canvas id="mapCanvas"></canvas>
            <div id="loading" class="loading" style="display: none;">
                <div id="loadingText">加载中...</div>
            </div>
        </div>
        <div id="sidebar">
            <div class="control-panel">
                <h3>图层管理</h3>
                <div id="layer-list"></div>
                <div style="margin-top: 10px;">
                    <input type="file" id="file-upload" accept=".geojson" />
                    <button class="btn" onclick="loadSampleData()">加载示例数据</button>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>地图操作</h3>
                <div class="btn-group">
                    <button class="btn" onclick="zoomIn()">🔍 放大</button>
                    <button class="btn" onclick="zoomOut()">🔭 缩小</button>
                    <button class="btn" onclick="resetView()">🌍 重置视图</button>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>编辑工具</h3>
                <div class="btn-group">
                    <button class="btn active" id="selectTool" onclick="setTool('select')">🎯 选择</button>
                    <button class="btn" id="pointTool" onclick="setTool('point')">📍 添加点</button>
                    <button class="btn" id="lineTool" onclick="setTool('line')">📏 添加线</button>
                    <button class="btn" id="polygonTool" onclick="setTool('polygon')">🔲 添加面</button>
                    <button class="btn" onclick="deleteSelected()">🗑️ 删除</button>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>查询统计</h3>
                <input type="text" id="searchInput" placeholder="搜索属性..." style="width: 100%; padding: 8px; margin-bottom: 10px;" />
                <button class="btn" onclick="performSearch()">🔎 搜索</button>
                <div id="stats-panel">
                    <div>总要素: <span id="totalFeatures">0</span></div>
                    <div>点: <span id="pointCount">0</span></div>
                    <div>线: <span id="lineCount">0</span></div>
                    <div>面: <span id="polygonCount">0</span></div>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>要素信息</h3>
                <div id="featureInfo" style="font-size: 12px;">
                    点击要素查看信息
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/jsoncanvas.js"></script>
</body>
</html>
