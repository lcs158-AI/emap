<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>跬步 | 雏鹰空间数据可视化平台</title>
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
    <div class="container">
        <header class="hero">
            <h1>雏鹰空间数据可视化平台</h1>
            <p class="subtitle">集成地图、照片、潮汐、测量与动态图层管理</p>
        </header>

        <div class="card-grid">
            <!-- 卡片采用左右两栏布局 -->
            <div class="card card-horizontal">
                <div class="card-image">
                    <!-- 正方形图片，可替换为实际地图预览图 -->
                    <img src="/pics/AIsea.png" alt="AIseamap">
                </div>
                <div class="card-content">
                    <h3>跬步地图</h3>
                    <p>2026年，基于openlayer，支持定位、测量、实时潮汐</p>
                    <a href="AIsea.html" class="btn">进入应用</a>
                </div>
            </div>
            <div class="card card-horizontal">
                <div class="card-image">
                    <img src="pics/global.png" alt="globalmap">
                </div>
                <div class="card-content">
                    <h3>跬步地球</h3>
                    <p>2026年，基于cesium，支持定位、测量、实时潮汐</p>
                    <a href="AIsea_global.html" class="btn">进入应用</a>
                </div>
            </div>
            <div class="card card-horizontal">
                <div class="card-image">
                    <img src="pics/jsoncanvas.png" alt="canvasmap">
                </div>
                <div class="card-content">
                    <h3>CANVAS地图</h3>
                    <p>2022-2026年，基于CANVAS+geojson的WEBGIS研发</p>
                    <a href="geojsoncanvas.html" class="btn">进入应用</a>
                </div>
            </div>
            <div class="card card-horizontal">
                <div class="card-image">
                    <img src="/pics/covid19.png" alt="covid19研学">
                </div>
                <div class="card-content">
                    <h3>COVID19传播分析</h3>
                    <p>全球COVID19疫情扩散与输入性风险分析—2020年3月海珠实验小学六年四班LIUZY同学的研学作品</p>
                    <a href="covid202003.html" class="btn">进入应用</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 雏鹰空间数据实验室 | 数据基于天地图、ESRI、NOAA、和风天气</p>
    </footer>
    </div>
</body>

</html>
