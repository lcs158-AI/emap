    if (s) return s;

  return 'https://lzy-fastapi.onrender.com';

<script>
const MAX_AMMO = 10;
const ARMOR = 3;
const MISSILE_CD = 1.5;       // 秒，与电脑端 CFG.missile.cooldown 一致
const FLARE_CD = 2.5;         // 秒，与电脑端 CFG.flare.cooldown 一致
const CANNON_RELEASE_MS = 0;  // 松开立即停止

const els = {
  modeName: document.getElementById('modeName'),
  clock: document.getElementById('clock'),
  score: document.getElementById('score'),
  remain: document.getElementById('remain'),
  armorPips: document.getElementById('armorPips'),
  ammo: document.getElementById('ammo'),
  status: document.getElementById('status'),
  statusText: document.getElementById('statusText'),
  // 摇杆
  zoneStick: document.getElementById('zoneStick'),
  stickBase: document.getElementById('stickBase'),
  stickKnob: document.getElementById('stickKnob'),
  // 武器按钮
  btnCannon: document.getElementById('btnCannon'),
  btnMissileSingle: document.getElementById('btnMissileSingle'),
  btnMissileDbl: document.getElementById('btnMissileDbl'),
  btnFlare: document.getElementById('btnFlare'),
  btnFlareNote: document.getElementById('btnFlareNote'),
  btnEvade: document.getElementById('btnEvade'),
  btnEvadeNote: document.getElementById('btnEvadeNote'),
  // 旧渲染元素（保留引用避免空指针）
  missileFoot: document.getElementById('missileFoot'),
  ammoDots: document.getElementById('ammoDots'),
  // 结算 / 菜单
  banner: document.getElementById('banner'),
  bannerTitle: document.getElementById('bannerTitle'),
  bannerText: document.getElementById('bannerText'),
  launchPanel: document.getElementById('launchPanel'),
  launchMode: document.getElementById('launchMode'),
  launchText: document.getElementById('launchText'),
  btnLaunch: document.getElementById('btnLaunch'),
  btnCancelLaunch: document.getElementById('btnCancelLaunch'),
  toast: document.getElementById('toast'),
  menuBtn: document.getElementById('menuBtn'),
  modeSheet: document.getElementById('modeSheet'),
  sheetList: document.getElementById('sheetList'),
  sheetClose: document.getElementById('sheetClose'),
  btnReplayPhone: document.getElementById('btnReplayPhone'),
  btnMenuPhone: document.getElementById('btnMenuPhone')
};

const state = {
  connected: false,
  host: false,
  phase: 'menu',
  time: 0,
  score: 0,
  remain: 0,
  total: 0,
  armor: ARMOR,
  ammo: MAX_AMMO,
  flares: Infinity,
  cd: 0,
  flareCd: 0,
  evadeCd: 0,
  cannonHeld: false,
  evadeHeld: false,
  resultShown: false,
  modes: [],
  menuOpen: false,
  ready: false,
  // 摇杆输出（归一化 -1 ~ +1）
  stick: { pitch: 0, yaw: 0, active: false }
};

/* ---------------- 基础 UI ---------------- */
for (let i = 0; i < ARMOR; i++) {
  const p = document.createElement('i');
  p.className = 'pip';
  els.armorPips.appendChild(p);
}
const armorPips = Array.from(els.armorPips.children);

for (let i = 0; i < MAX_AMMO; i++) {
  const d = document.createElement('i');
  d.className = 'ammo-dot';
  els.ammoDots.appendChild(d);
}
const ammoDots = Array.from(els.ammoDots.children);

let toastTimer = 0;
function toast(text, ms = 1800) {
  els.toast.textContent = text;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), ms);
}

function setStatus(kind, text) {
  els.status.className = 'status' + (kind ? ' ' + kind : '');
  els.statusText.textContent = text;
}

let connError = '';
let connAttempts = 0;

function refreshStatus() {
  if (state.connected) {
    if (state.host) { setStatus('ok', '已连接电脑'); return; }
    setStatus('warn', '等待电脑端…');
    return;
  }
  if (connAttempts > 0) {
    setStatus('err', '连接失败 ' + connAttempts + ' 次' + (connError ? ' · ' + connError : ''));
  } else {
    setStatus('warn', '连接中…');
  }
}

function buzz(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ---------------- 输入兼容（微信 X5 / 部分国产浏览器 Pointer Events 不完整） ---------------- */
const HAS_POINTER = typeof window.PointerEvent === 'function';
const HAS_TOUCH = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;

/**
 * 按压绑定：优先触摸事件，Pointer Events 作为另一来源；
 * 用时间戳对同一手势的跨事件源重复触发去重（Chrome 会先派发 pointerdown 再派发 touchstart）。
 */
function onPress(el, down, up) {
  let touchTime = 0;
  let ptrTime = 0;

  if (HAS_TOUCH) {
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (Date.now() - ptrTime < 600) return;
      touchTime = Date.now();
      down(e);
    }, { passive: false });
    if (up) {
      const end = (e) => {
        if (e.cancelable) e.preventDefault();
        if (Date.now() - ptrTime < 600) return;
        touchTime = Date.now();
        up(e);
      };
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('touchcancel', end);
    }
  }

  if (HAS_POINTER) {
    el.addEventListener('pointerdown', (e) => {
      if (Date.now() - touchTime < 600) return;
      ptrTime = Date.now();
      down(e);
    });
    if (up) {
      const pUp = (e) => {
        if (Date.now() - touchTime < 600) return;
        ptrTime = Date.now();
        up(e);
      };
      el.addEventListener('pointerup', pUp);
      el.addEventListener('pointercancel', pUp);
      el.addEventListener('lostpointercapture', pUp);
    }
  }

  if (!HAS_TOUCH && !HAS_POINTER) {
    el.addEventListener('mousedown', down);
    if (up) {
      el.addEventListener('mouseup', up);
      el.addEventListener('mouseleave', up);
    }
  }
}

/* ---------------- 状态渲染 ---------------- */
function isPlaying() { return state.phase === 'playing'; }

function renderZones() {
  const playing = isPlaying();
  els.zoneStick.classList.toggle('disabled', !playing);
  const allBtns = document.querySelectorAll('.weapon-zone .wbtn');
  allBtns.forEach(b => b.classList.toggle('disabled', !playing));
}

function renderAmmo() {
  els.ammo.textContent = state.ammo;
  if (els.ammoDots) {
    ammoDots.forEach((d, i) => d.classList.toggle('empty', i >= state.ammo));
  }
  // 更新导弹按钮状态提示
  const dbl = els.btnMissileDbl;
  const single = els.btnMissileSingle;
  if (state.ammo >= 2) {
    dbl.textContent = 'K 双发导弹（剩 ' + state.ammo + '）';
    single.textContent = 'I 单发导弹（剩 ' + state.ammo + '）';
    dbl.classList.remove('empty'); single.classList.remove('empty');
  } else if (state.ammo === 1) {
    dbl.textContent = 'K 双发导弹（1发，仅单发）';
    single.textContent = 'I 单发导弹（剩 1）';
    dbl.classList.add('empty');
    single.classList.remove('empty');
  } else {
    dbl.textContent = 'K 双发导弹（已耗尽）';
    single.textContent = 'I 单发导弹（已耗尽）';
    dbl.classList.add('empty'); single.classList.add('empty');
  }
}

function renderArmor() {
  if (armorPips) armorPips.forEach((p, i) => p.classList.toggle('empty', i >= state.armor));
}

function renderFlares() {
  if (state.flareCd > 0) {
    els.btnFlareNote.textContent = '冷却 ' + state.flareCd.toFixed(1) + 's';
    els.btnFlare.classList.add('cooling');
  } else {
    els.btnFlareNote.textContent = '点按释放';
    els.btnFlare.classList.remove('cooling');
  }
}

function renderEvade() {
  if (state.evadeCd > 0) {
    els.btnEvadeNote.textContent = '冷却 ' + state.evadeCd.toFixed(1) + 's';
    els.btnEvade.classList.add('cooling');
  } else {
    els.btnEvadeNote.textContent = '按住触发 · 2.5s CD';
    els.btnEvade.classList.remove('cooling');
  }
}

function renderClock() {
  const t = Math.max(0, Math.ceil(state.time));
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  els.clock.textContent = mm + ':' + ss;
  els.clock.classList.toggle('urgent', isPlaying() && t <= 20);
}

function renderBanner() {
  if (state.phase === 'result') {
    if (!state.resultShown) {
      state.resultShown = true;
      const win = state.win;
      els.banner.classList.remove('hidden', 'lose');
      if (!win) els.banner.classList.add('lose');
      els.bannerTitle.textContent = win ? '任务成功' : '任务失败';
      els.bannerText.textContent =
        '得分 ' + state.score + ' · 剩余目标 ' + state.remain + ' / ' + state.total;
      releaseCannon();
    }
  } else {
    state.resultShown = false;
    els.banner.classList.add('hidden');
  }
}

function applyState(s) {
  if (!s) return;
  state.host = true;
  state.connected = true;
  if (typeof s.phase === 'string') state.phase = s.phase;
  if (typeof s.mode === 'string' && s.mode) {
    state.modeName = s.mode;
    els.modeName.textContent = s.mode + (typeof s.diff === 'string' && s.diff ? ' · ' + s.diff : '');
  }
  state.ready = !!s.ready;
  if (typeof s.time === 'number') state.time = s.time;
  if (typeof s.score === 'number') state.score = s.score;
  if (typeof s.remain === 'number') state.remain = s.remain;
  if (typeof s.remaining === 'number') state.remain = s.remaining;
  if (typeof s.total === 'number') state.total = s.total;
  if (typeof s.armor === 'number') state.armor = s.armor;
  if (typeof s.ammo === 'number') state.ammo = s.ammo;
  if (typeof s.flares === 'number') state.flares = s.flares;
  else if (s.flares === null) state.flares = Infinity;   // null 表示无限
  state.win = s.result === 'win';
  if (Array.isArray(s.modes)) {
    state.modes = s.modes;
    if (state.menuOpen) renderModeSheet();
  }

  els.score.textContent = state.score;
  els.remain.textContent = state.remain;
  renderAmmo();
  renderArmor();
  renderFlares();
  renderClock();
  renderZones();
  renderBanner();
  renderLaunchPanel();
  refreshStatus();
  if (state.phase !== 'playing') releaseCannon();
}

/* ---------------- 出击准备页（V2.7.1）：手机上直接确认出击 / 返回选模式 ---------------- */
function renderLaunchPanel() {
  const show = state.phase === 'preflight';
  els.launchPanel.classList.toggle('hidden', !show);
  if (!show) return;
  els.launchMode.textContent = state.modeName ? '· ' + state.modeName : '';
  els.btnLaunch.disabled = !state.ready;
  els.launchText.textContent = state.ready
    ? '检查完成，可直接在手机上确认出击'
    : '电脑端正在检查摄像头与姿态识别，请稍候…';
}

/* ---------------- 通信 ---------------- */
function canFire() {
  if (!state.connected) { toast('尚未连接服务'); return false; }
  if (!state.host) { toast('电脑游戏页尚未打开'); return false; }
  return true;
}

function sendWeapon(payload) {
  if (!socket || !socket.connected) { toast('连接已断开'); return false; }
  socket.emit('weapon', payload);
  return true;
}

/* ---------------- 手机端菜单 / 选模式（V2.5.2） ---------------- */
function sendCommand(action, mode) {
  if (!state.connected || !socket || !socket.connected) { toast('连接已断开'); return false; }
  if (!state.host) { toast('电脑游戏页尚未打开'); return false; }
  socket.emit('command', { action, mode });
  return true;
}

function renderModeSheet() {
  if (!els.sheetList) return;
  els.sheetList.innerHTML = '';
  if (!state.modes.length) {
    const d = document.createElement('div');
    d.className = 'sheet-empty';
    d.textContent = '电脑端暂未上报战场列表';
    els.sheetList.appendChild(d);
    return;
  }
  for (const m of state.modes) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sheet-item';
    b.innerHTML = '<b>' + m.name + '</b><span>' + (m.tag || '') + '</span>';
    b.addEventListener('click', () => {
      if (sendCommand('mode', m.id)) {
        closeModeSheet();
        toast('已选择 ' + m.name + ' · 电脑端出击');
      }
    });
    els.sheetList.appendChild(b);
  }
}

function openModeSheet() {
  if (!state.connected) { toast('尚未连接服务'); return; }
  if (!state.host) { toast('电脑游戏页尚未打开'); return; }
  if (state.phase === 'playing' || state.phase === 'countdown') {
    toast('战斗中，结束后再选模式');
    return;
  }
  state.menuOpen = true;
  renderModeSheet();
  els.modeSheet.classList.remove('hidden');
}

function closeModeSheet() {
  state.menuOpen = false;
  els.modeSheet.classList.add('hidden');
}

els.menuBtn.addEventListener('click', () => {
  if (state.menuOpen) closeModeSheet();
  else openModeSheet();
});
els.sheetClose.addEventListener('click', () => closeModeSheet());
els.modeSheet.addEventListener('click', (e) => {
  if (e.target === els.modeSheet) closeModeSheet();
});
els.btnReplayPhone.addEventListener('click', () => {
  if (sendCommand('replay')) toast('重玩本局');
});
els.btnMenuPhone.addEventListener('click', () => {
  if (sendCommand('menu')) {
    openModeSheet();
    toast('已返回选模式');
  }
});
els.btnLaunch.addEventListener('click', () => {
  if (els.btnLaunch.disabled) return;
  if (sendCommand('launch')) {
    buzz(20);
    toast('已确认出击');
  }
});
els.btnCancelLaunch.addEventListener('click', () => {
  if (sendCommand('menu')) {
    closeModeSheet();
    toast('已返回选模式');
  }
});

let socket = null;
const hasIO = typeof io === 'function';

if (hasIO) {
  // 不强制 transports：默认先 polling 再升级 websocket，移动网络下更稳
  socket = io(window.GAME_SERVER, {
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 800,
    reconnectionDelayMax: 4000,
    timeout: 12000
  });

  socket.on('connect', () => {
    state.connected = true;
    connAttempts = 0;
    connError = '';
    socket.emit('join', 'controller');
    refreshStatus();
  });

  socket.on('presence', (p) => {
    state.host = !!(p && p.host);
    refreshStatus();
  });

  socket.on('state', (s) => applyState(s));

  socket.on('weaponResult', (r) => {
    if (r && !r.ok) toast(r.reason === 'host-offline' ? '电脑端未连接' : '指令未送达');
  });

  socket.on('fireResult', (r) => {
    if (r && !r.ok) toast('电脑端未连接，发射失败');
  });

  socket.on('commandResult', (r) => {
    if (r && !r.ok) toast(r.reason === 'host-offline' ? '电脑端未连接' : '指令未送达');
  });

  socket.on('disconnect', () => {
    state.connected = false;
    state.host = false;
    releaseCannon();
    refreshStatus();
  });

  socket.on('connect_error', (err) => {
    state.connected = false;
    releaseCannon();
    connAttempts += 1;
    connError = (err && (err.message || err.type)) || '网络不可达';
    refreshStatus();
    if (connAttempts === 1) toast('连不上中继服务器：' + connError, 3000);
  });
} else {
  setStatus('err', '无法加载通信库');
}

// 长按状态条：修改中继服务器地址（需与电脑端一致），便于移动网络访问不到默认服务器时切换
(function bindServerSwitch() {
  if (!els.status) return;
  let t = 0;
  const open = () => {
    const cur = window.GAME_SERVER;
    const v = window.prompt('中继服务器地址（手机与电脑必须填同一个）', cur);
    if (v && v.trim() && v.trim() !== cur) {
      try { localStorage.setItem('mj.server', v.trim()); } catch (e) { /* ignore */ }
      location.reload();
    }
  };
  const start = () => { t = setTimeout(open, 700); };
  const cancel = () => clearTimeout(t);
  els.status.addEventListener('touchstart', start, { passive: true });
  els.status.addEventListener('touchend', cancel);
  els.status.addEventListener('touchmove', cancel, { passive: true });
  els.status.addEventListener('mousedown', start);
  els.status.addEventListener('mouseup', cancel);
  els.status.addEventListener('mouseleave', cancel);
})();

/* ---------------- 供自动化测试访问内部状态 ---------------- */
window.__ctl = {
  state,
  get socket() { return socket; }
};

/* ---------------- 旧武器区清理 ---------------- */
// 原 onPress(zoneCannon/zoneMissile/zoneFlare) 已移除，改用新按钮绑定
window.removeEventListener && window.removeEventListener('pointerup', releaseCannon);

/* ======================================================
   V2.8.0 新武器按钮 + 飞行摇杆 + flight 通道
   ====================================================== */

// ---- 机炮 ----
function pressCannon(e) {
  if (e) e.preventDefault();
  if (!isPlaying()) { toast('尚未开始战斗'); return; }
  if (state.cannonHeld) return;
  if (!canFire()) return;
  if (!sendWeapon({ type: 'cannon', action: 'down' })) return;
  state.cannonHeld = true;
  els.btnCannon.classList.add('pressed');
  buzz(18);
}
function releaseCannon() {
  if (!state.cannonHeld) return;
  state.cannonHeld = false;
  if (els.btnCannon) els.btnCannon.classList.remove('pressed');
  if (socket && socket.connected) socket.emit('weapon', { type: 'cannon', action: 'up' });
}
onPress(els.btnCannon, pressCannon, releaseCannon);

// ---- 导弹（单发 I / 双发 K） ----
function fireMissile(e, double = false) {
  if (e) e.preventDefault();
  if (!isPlaying()) { toast('尚未开始战斗'); return; }
  if (state.cd > 0) { toast('导弹冷却 ' + state.cd.toFixed(1) + 's'); return; }
  const need = double ? 2 : 1;
  if (state.ammo < need) { toast('导弹不足，剩余 ' + state.ammo + ' 发'); return; }
  if (!canFire()) return;
  if (!sendWeapon({ type: double ? 'missileDbl' : 'missile', action: 'fire' })) return;
  state.cd = MISSILE_CD;
  state.ammo = Math.max(0, state.ammo - need);
  renderAmmo();
  buzz(35);
  (double ? els.btnMissileDbl : els.btnMissileSingle).classList.add('pressed');
  setTimeout(() => (double ? els.btnMissileDbl : els.btnMissileSingle).classList.remove('pressed'), 150);
}
onPress(els.btnMissileSingle, (e) => fireMissile(e, false), null);
onPress(els.btnMissileDbl,    (e) => fireMissile(e, true),  null);

// ---- 干扰弹 L ----
function fireFlare(e) {
  if (e) e.preventDefault();
  if (!isPlaying()) { toast('尚未开始战斗'); return; }
  if (state.flareCd > 0) { toast('干扰弹冷却 ' + state.flareCd.toFixed(1) + 's'); return; }
  if (Number.isFinite(state.flares) && state.flares <= 0) { toast('干扰弹已耗尽'); return; }
  if (!canFire()) return;
  if (!sendWeapon({ type: 'flare', action: 'fire' })) return;
  state.flareCd = FLARE_CD;
  if (Number.isFinite(state.flares)) state.flares = Math.max(0, state.flares - 1);
  renderFlares();
  buzz(25);
  els.btnFlare.classList.add('pressed');
  setTimeout(() => els.btnFlare.classList.remove('pressed'), 150);
}
onPress(els.btnFlare, fireFlare, null);

// ---- 紧急规避 ----
function pressEvade(e) {
  if (e) e.preventDefault();
  if (!isPlaying()) return;
  if (state.evadeCd > 0) { toast('紧急规避冷却 ' + state.evadeCd.toFixed(1) + 's'); return; }
  if (!canFire()) return;
  state.evadeHeld = true;
  els.btnEvade.classList.add('pressed');
  socket.emit('weapon', { type: 'evade', action: 'fire' });
  state.evadeCd = 2.5;
  renderEvade();
  buzz(40);
  toast('紧急规避！', 700);
}
function releaseEvade() {
  state.evadeHeld = false;
  if (els.btnEvade) els.btnEvade.classList.remove('pressed');
}
onPress(els.btnEvade, pressEvade, releaseEvade);

/* ======================================================
   左飞行摇杆（V2.8.0 新增）
   - 双轴：俯仰（Y 轴上=+1/下=-1） + 航向（X 轴左=+1/右=-1）
   - 死区 ±10%，输出归一化 -1~+1
   - 松手平滑回中
   ====================================================== */
const JOY_DEAD = 0.10;      // 死区
const JOY_RADIUS_RATIO = 0.42; // 摇杆球活动半径 / 底盘半径
let joyTouchId = null;
let joyOrigin = { x: 0, y: 0 };
let joyRadius = 0;
let joyKnobSize = 0;

function initJoystickMetrics() {
  if (!els.stickBase) return;
  const r = els.stickBase.getBoundingClientRect();
  joyRadius = Math.min(r.width, r.height) * JOY_RADIUS_RATIO;
  joyOrigin.x = r.left + r.width / 2;
  joyOrigin.y = r.top + r.height / 2;
  const knob = els.stickKnob.getBoundingClientRect();
  joyKnobSize = knob.width;
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function updateJoystickUI(dx, dy) {
  if (!els.stickKnob) return;
  const maxR = joyRadius || 40;
  const dist = Math.hypot(dx, dy);
  let kx = dx, ky = dy;
  if (dist > maxR) { kx = dx / dist * maxR; ky = dy / dist * maxR; }
  // knob 中心要从原点偏移 kx, ky
  els.stickKnob.style.transform = `translate(${kx}px, ${ky}px)`;
}

function normalizeJoystick(dx, dy) {
  const maxR = joyRadius || 40;
  const nx = clamp(dx / maxR, -1, 1);
  const ny = clamp(dy / maxR, -1, 1);
  // 死区：半径 < dead% 视为 0
  const len = Math.hypot(nx, ny);
  if (len < JOY_DEAD) return { pitch: 0, yaw: 0 };
  // 缩放到 [dead, 1] → [0, 1]
  const scale = (len - JOY_DEAD) / (1 - JOY_DEAD);
  return {
    pitch: -ny * scale,     // 上推=爬升 +pitchIn
    yaw:   -nx * scale      // 左拉=机头左扫 +yawIn → 但 game.js 里 yawIn 符号需一致
  };
}

function startJoystick(clientX, clientY, touchId) {
  initJoystickMetrics();
  joyTouchId = touchId;
  joyOrigin.x = clientX;
  joyOrigin.y = clientY;
  state.stick.active = true;
  // knob 居中（通过 transform 重置）
  if (els.stickKnob) els.stickKnob.style.transform = `translate(0, 0)`;
  if (els.stickBase) els.stickBase.classList.add('active');
}

function moveJoystick(clientX, clientY) {
  if (joyTouchId === null) return;
  const dx = clientX - joyOrigin.x;
  const dy = clientY - joyOrigin.y;
  updateJoystickUI(dx, dy);
  const v = normalizeJoystick(dx, dy);
  state.stick.pitch = v.pitch;
  state.stick.yaw = v.yaw;
  sendJoystickFlight();
}

function endJoystick(touchId) {
  if (touchId !== undefined && touchId !== null && touchId !== joyTouchId) return;
  joyTouchId = null;
  state.stick.active = false;
  state.stick.pitch = 0;
  state.stick.yaw = 0;
  if (els.stickKnob) els.stickKnob.style.transform = `translate(0, 0)`;
  if (els.stickBase) els.stickBase.classList.remove('active');
  sendJoystickFlight(); // 发送一次归零
}

function sendJoystickFlight() {
  if (!state.connected || !socket || !socket.connected) return;
  if (state.phase !== 'playing') return;
  socket.emit('flight', {
    pitch: state.stick.pitch,
    yaw:   state.stick.yaw,
    dirX:  0,   // 暂不提供横移（通过压坡度+航向间接实现）
    source: 'touch',
    ts: performance.now()
  });
}

// 摇杆事件绑定（Pointer Events 优先，fallback touch）
(function bindJoystick() {
  const zone = els.zoneStick;
  if (!zone) return;

  if (HAS_POINTER) {
    zone.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initJoystickMetrics();
      // 以当前手指位置为原点（让玩家触摸的地方即摇杆中心）
      startJoystick(e.clientX, e.clientY, e.pointerId);
      try { zone.setPointerCapture(e.pointerId); } catch (_) {}
    });
    zone.addEventListener('pointermove', (e) => {
      if (joyTouchId === null || joyTouchId !== e.pointerId) return;
      e.preventDefault();
      moveJoystick(e.clientX, e.clientY);
    });
    const end = (e) => {
      if (joyTouchId === null || joyTouchId !== e.pointerId) return;
      e.preventDefault();
      endJoystick(e.pointerId);
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
    zone.addEventListener('lostpointercapture', end);
  } else if (HAS_TOUCH) {
    zone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (joyTouchId !== null) return;
      const t = e.changedTouches[0];
      initJoystickMetrics();
      startJoystick(t.clientX, t.clientY, t.identifier);
    }, { passive: false });
    zone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (joyTouchId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouchId) { moveJoystick(t.clientX, t.clientY); break; }
      }
    }, { passive: false });
    const tc = ['touchend', 'touchcancel'];
    tc.forEach(ev => zone.addEventListener(ev, (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouchId) { endJoystick(t.identifier); break; }
      }
    }, { passive: false }));
  } else {
    zone.addEventListener('mousedown', (e) => {
      startJoystick(e.clientX, e.clientY, 'mouse');
      const onMove = (ev) => moveJoystick(ev.clientX, ev.clientY);
      const onUp = () => {
        endJoystick('mouse');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }
})();

// ---- loop 冷却动画 + 规避冷却发送 ----
let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(now - lastFrame, 120);
  lastFrame = now;

  if (state.cd > 0) {
    state.cd = Math.max(0, state.cd - dt / 1000);
    if (state.cd === 0 && isPlaying()) buzz(15);
  }

  if (state.flareCd > 0) {
    state.flareCd = Math.max(0, state.flareCd - dt / 1000);
    renderFlares();
  }

  if (state.evadeCd > 0) {
    state.evadeCd = Math.max(0, state.evadeCd - dt / 1000);
    renderEvade();
  }

  // 摇杆在 playing 态下每帧确保同步（防止手指不动时 socket 丢包）
  if (state.phase === 'playing' && state.stick.active) sendJoystickFlight();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 首次若未收到状态，默认按菜单态渲染 */
renderZones();
renderAmmo();
renderArmor();
renderFlares();
renderEvade();
renderClock();
renderLaunchPanel();
refreshStatus();
</script>
