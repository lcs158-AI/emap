<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cesium 地球</title>
    <!-- Cesium 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.113/Build/Cesium/Widgets/widgets.css">
    <!-- Cesium.js -->
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.113/Build/Cesium/Cesium.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/global.css">

</head>

<body>
    <div id="cesiumContainer"></div>
    <div class="toolbar">
        <button id="locateBtn">📍 显示我的位置</button>
        <button id="toggleEsriBtn">🗺️ 切换 Esri 影像</button>
        <button id="measureBtn">📏 测量距离</button>
        <button id="tideBtn">🌊 查潮汐</button>
    </div>
    <div id="tidePanel">
        <div style="display: flex; justify-content: space-between;">
            <h4>🌊 潮汐信息</h4>
            <button id="closeTideBtn" class="close-btn">✕</button>
        </div>
        <div id="tideLocation"></div>
        <div id="tideCurrent">-- 米</div>
        <div id="tideTime"></div>
        <div id="tideChartContainer">
            <canvas id="tideChart" width="400" height="120"></canvas>
        </div>
        <div style="font-size: 10px; color: #aaa; text-align: right;">数据：和风天气</div>
    </div>
    <div id="measureResult">距离: -- 米</div>
