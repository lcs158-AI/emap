<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>跬步地球1.211</title>
    <!-- Cesium 本地样式 -->
    <link rel="stylesheet" href="libs/cesium/Widgets/widgets.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/global.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Cesium 本地库 -->
    <script src="libs/cesium/Cesium.js"></script>
</head>

<body>
    <div id="cesiumContainer"></div>
    <div class="toolbar">
        <button id="locateBtn">📍</button>
        <button id="toggleAnnotationBtn">🏷️</button>
        <button id="measureBtn">📏</button>
        <button id="tideBtn">🌊</button>
    </div>
    <div id="tidePanel">
        <div style="display: flex; justify-content: space-between;">
            <h4>🌊 潮汐信息</h4>
            <button id="closeTideBtn" class="close-btn">✕</button>
        </div>
        <div id="tideLocation"></div>
        <div id="tideCurrent">-- 米</div>
        <div id="tideTime"></div>
        <div id="tideChartContainer">
            <canvas id="tideChart" width="400" height="120"></canvas>
        </div>
        <div style="font-size: 10px; color: #aaa; text-align: right;">数据：和风天气</div>
    </div>
    <div id="measureResult">距离: -- 米</div>

    <!-- 引入配置文件 -->
    <script src="js/config.js"></script>
    <!-- 全局配置 -->
    <script>
        const TIANDITU_KEY = '4110bba1f23cd04ed33e43ab12a291fc';
        // 初始位置：[经度, 纬度, 高度(米)]
        const initCenter = [111.18, 21.48, 5000, 45];   // 经度,纬度,高度,俯仰角
        const offsetK = 1.2;                            // 偏移系数
        const photoPoints = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "geometry": { "type": "Point", "coordinates": [111.212202, 21.483160] }, "properties": { "DD": "博贺湾大酒店", "MC": "IMG_20260226_133945565.jpg" } },
                { "type": "Feature", "geometry": { "type": "Point", "coordinates": [111.116915, 21.467190] }, "properties": { "DD": "滨海旅游公路", "MC": "IMG_20260226_164817880.jpg" } }
            ]
        };
    </script>
    <!-- 引入通用工具和 Cesium 核心逻辑 -->
    <script src="js/utils.js"></script>
    <script src="js/global.js"></script>
</body>

</html>
