<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>跬步地球1.237</title>
    <!-- Cesium 本地样式 -->
    <link rel="stylesheet" href="libs/cesium/Widgets/widgets.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/global.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Cesium 本地库 -->
    <script src="libs/cesium/Cesium.js"></script>
</head>

<body>
    <!-- 全屏加载界面 -->
    <div id="loadingScreen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-title">跬步地球</div>
            <div class="loading-progress-wrapper">
                <div id="loadingProgress" class="loading-progress-bar"></div>
            </div>
            <div id="loadingText" class="loading-text">正在初始化...</div>
            <div id="loadingPercentage" class="loading-percentage">0%</div>
        </div>
    </div>
    
    <div id="cesiumContainer"></div>
    <div class="toolbar">
        <button id="locateBtn" data-tooltip="📍 定位">📍</button>
        <button id="toggleAnnotationBtn" data-tooltip="🏷️ 标注">🏷️</button>
        <button id="measureBtn" data-tooltip="📏 测量">📏</button>
        <button id="tideBtn" data-tooltip="🌊 潮汐">🌊</button>
        <button id="flyBtn" data-tooltip="✈️ 飞行">✈️</button>
    </div>
    <div id="tidePanel" style="display: none;">
        <div style="display: flex; justify-content: space-between;">
            <h4>🌊 潮汐信息</h4>
            <button id="closeTideBtn" class="close-btn">✕</button>
        </div>
        <div id="tideLocation"></div>
        <div id="tideCurrent">-- 米</div>
        <div id="tideTime"></div>
        <div id="tideDetail"></div>
        <div id="tideChartContainer">
            <canvas id="tideChart" width="400" height="120"></canvas>
        </div>
        <div style="font-size: 10px; color: #aaa; text-align: right;">数据：和风天气</div>
    </div>
    <div id="measureResult">距离: -- 米</div>

    <!-- 飞行规划面板 -->
    <div id="flyPanel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h4 style="margin: 0; color: #1890ff;">✈️ 飞行规划</h4>
            <button id="closeFlyBtn" class="close-btn">✕</button>
        </div>
        <div id="flyRouteList"></div>
        <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
            <button id="stopFlyBtn" class="fly-control-btn" style="display: none;">⏹️ 停止</button>
            <button id="pauseFlyBtn" class="fly-control-btn" style="display: none;">⏸️ 暂停</button>
            <button id="resumeFlyBtn" class="fly-control-btn" style="display: none;">▶️ 继续</button>
        </div>
        <div id="speedControl" style="display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee;">
            <div style="font-size: 11px; color: #666; margin-bottom: 4px;">飞行速度：</div>
            <div style="display: flex; gap: 4px;">
                <button class="speed-btn" data-speed="0.5">🐢 0.5x</button>
                <button class="speed-btn active" data-speed="1">🚶 1x</button>
                <button class="speed-btn" data-speed="2">🏃 2x</button>
                <button class="speed-btn" data-speed="4">🚗 4x</button>
                <button class="speed-btn" data-speed="8">✈️ 8x</button>
            </div>
        </div>
        <div id="flyStatus" style="font-size: 11px; color: #888; margin-top: 8px;"></div>
    </div>

    <!-- 引入配置文件 -->
    <script src="js/config.js"></script>
    <!-- 全局配置 -->
    <script>
        const TIANDITU_KEY = '4110bba1f23cd04ed33e43ab12a291fc';
        // 初始位置：[经度, 纬度, 高度(米)]
        const initCenter = [111.18, 21.48, 5000, 45];   // 经度,纬度,高度,俯仰角
        const offsetK = 1.2;                            // 偏移系数
        const photoPoints = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "geometry": { "type": "Point", "coordinates": [111.212202, 21.483160] }, "properties": { "DD": "博贺湾大酒店", "MC": "IMG_20260226_133945565.jpg" } },
                { "type": "Feature", "geometry": { "type": "Point", "coordinates": [111.116915, 21.467190] }, "properties": { "DD": "滨海旅游公路", "MC": "IMG_20260226_164817880.jpg" } }
            ]
        };
    </script>
    <!-- 引入通用工具和 Cesium 核心逻辑 -->
    <script src="js/utils.js?v=1.240"></script>
    <script src="js/global.js?v=1.240"></script>
</body>

</html>
