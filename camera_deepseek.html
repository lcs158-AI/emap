<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>精准摄像头测量 - 增强方向版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            padding: 16px;
            padding-bottom: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            color: #1f2d3d;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .section {
            background: #fafcff;
            border: 1px solid #e4e7ed;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 1.1rem;
            border-left: 4px solid #1890ff;
            padding-left: 12px;
            margin-bottom: 12px;
            color: #2c3e50;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .param-row label {
            font-weight: 500;
            color: #4a5568;
            min-width: 110px;
        }
        .param-row value, .param-row span {
            color: #1890ff;
            font-weight: 500;
        }
        input, select {
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 16px;
            font-size: 14px;
            background: white;
            width: 140px;
            text-align: center;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.97); background: #0c73d4; }
        button.warning { background: #fa8c16; }
        button.secondary { background: #52c41a; }
        .flex-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .flex-row button { margin-top: 0; }
        video {
            width: 100%;
            border-radius: 20px;
            background: #000;
            margin-top: 8px;
        }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 40px;
            text-align: center;
            font-size: 0.85rem;
        }
        .status.info { background: #e3f2fd; color: #0b5e9e; }
        .status.success { background: #e8f5e9; color: #2e7d32; }
        .status.error { background: #ffebee; color: #c62828; }
        .preview-img {
            width: 100%;
            border-radius: 16px;
            margin-top: 12px;
            display: none;
        }
        .param-card {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
            display: none;
        }
        .hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 8px;
            text-align: center;
        }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .param-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 精准摄像头测量</h1>

    <!-- 摄像头区 -->
    <div class="section">
        <h2>📷 后置摄像头</h2>
        <video id="cameraPreview" autoplay playsinline></video>
        <div class="flex-row">
            <button id="startCameraBtn">🔘 启动摄像头</button>
            <button id="capturePhotoBtn" style="display:none;">📸 拍照</button>
            <button id="uploadPhotoBtn" style="display:none;">⬆️ 上传照片</button>
        </div>
        <div class="hint">※ 启动后请允许摄像头和传感器权限</div>
    </div>

    <!-- 实时传感器数据 -->
    <div class="section" id="sensorData" style="display:none;">
        <h2>🧭 实时方向（融合增强）</h2>
        <div class="param-row"><label>方位角（磁北）:</label><value id="compassValue">-- °</value></div>
        <div class="param-row"><label>俯仰角（水平为0°，向下负）:</label><value id="pitchValue">-- °</value></div>
        <div class="param-row"><label>⚡ 原始真北参考:</label><value id="rawAlphaValue">-- °</value></div>
        <button id="calibrateBtn" class="warning">🔄 开始8字校准</button>
        <div class="hint">※ 若方向不稳定，请执行8字校准（画横∞）</div>
    </div>

    <!-- 位置与高度 -->
    <div class="section">
        <h2>📍 位置 & 高度</h2>
        <div class="param-row"><label>纬度:</label><input type="number" id="latitude" step="0.000001" value="31.2304"></div>
        <div class="param-row"><label>经度:</label><input type="number" id="longitude" step="0.000001" value="121.4737"></div>
        <div class="param-row"><label>相机相对高度(米):</label><input type="number" id="relativeHeightInput" step="0.1" value="1.6"><span id="altitudeHint"></span></div>
        <div class="param-row"><label>平地模式(固定1.6m):</label><input type="checkbox" id="flatModeCheck"></div>
        <div class="param-row"><label>GPS海拔:</label><span id="gpsAltDisplay">未获取</span></div>
        <button id="getLocationBtn">📍 获取GPS位置</button>
    </div>

    <!-- 视域计算参数 -->
    <div class="section" id="footprintSettings" style="display:none;">
        <h2>📐 视域计算</h2>
        <div class="param-row"><label>水平视场角:</label><value>78°</value></div>
        <div class="param-row"><label>垂直视场角:</label><value>43°</value></div>
        <div class="param-row"><label>拍摄距离(米):</label><input type="number" id="distanceInput" step="1" value="10"><span>(自动计算时覆盖)</span></div>
        <div class="param-row"><label>自动计算距离:</label><input type="checkbox" id="autoDistanceCheck" checked></div>
        <div class="param-row"><label>视域范围(宽×高):</label><value id="footprintSize">--</value></div>
        <div class="param-row"><label>问题类型:</label>
            <select id="problemTypeSelect">
                <option value="">请选择</option>
                <option value="违法建筑">违法建筑</option>
                <option value="垃圾堆积">垃圾堆积</option>
                <option value="道路破损">道路破损</option>
                <option value="其他">其他</option>
            </select>
        </div>
    </div>

    <!-- 拍照预览区 -->
    <div class="section">
        <h2>📸 拍照记录</h2>
        <img id="capturedPhotoPreview" class="preview-img" alt="预览">
        <div id="capturedParams" class="param-card"></div>
    </div>

    <div id="statusMsg" class="status info">✅ 请点击「启动摄像头」开始</div>
</div>

<script>
    // ======================== 全局变量 ========================
    let cameraStream = null;
    let filteredCompass = null;      // 最终磁北方位角 0-360
    let filteredPitch = null;        // 镜头俯仰角（水平0°，向下为负）
    let rawAlpha = 0;                // 原始alpha（用于显示参考）
    let currentLat = 0, currentLon = 0;
    let capturedPhoto = null;
    let capturedParams = null;

    // 互补滤波相关
    let useAbsolute = false;
    let lastTimestamp = 0;
    let gyroAngle = 0;
    const COMP_FILTER = 0.96;        // 陀螺仪权重
    let orientationHandler = null;
    let motionHandler = null;
    let lastGyroAlpha = 0;

    // DOM 元素
    let videoEl, startBtn, captureBtn, uploadBtn;
    let compassSpan, pitchSpan, rawAlphaSpan;
    let latitudeInput, longitudeInput, relativeHeightInput, flatModeCheck, autoDistanceCheck, distanceInput;
    let footprintSizeSpan, calibrateBtn, getLocationBtn, altitudeHint, gpsAltSpan;
    let photoPreview, paramsDiv, statusDiv, problemTypeSelect;

    // 常量
    const H_FOV = 78;
    const V_FOV = 43;
    const SMOOTH = 0.2;

    // ======================== 辅助函数 ========================
    function updateStatus(msg, type = 'info') {
        statusDiv.textContent = msg;
        statusDiv.className = `status ${type}`;
        console.log(`[${type}] ${msg}`);
    }

    Math.radians = deg => deg * Math.PI / 180;
    Math.degrees = rad => rad * 180 / Math.PI;

    // 角度归一化
    function normAngle(angle) {
        angle = angle % 360;
        if (angle < 0) angle += 360;
        return angle;
    }

    // 更新UI（方位角、俯仰角、视域）
    function updateSensorUI() {
        if (compassSpan) compassSpan.innerText = (filteredCompass !== null ? filteredCompass.toFixed(1) : '--') + '°';
        if (pitchSpan) pitchSpan.innerText = (filteredPitch !== null ? filteredPitch.toFixed(1) : '--') + '°';
        if (rawAlphaSpan) rawAlphaSpan.innerText = rawAlpha.toFixed(1) + '°';
        computeAndUpdateFootprint();   // 实时计算视域
    }

    // 视域计算与显示
    function computeAndUpdateFootprint() {
        if (!relativeHeightInput) return;
        let relH = parseFloat(relativeHeightInput.value) || 1.6;
        if (relH < 1) { relH = 1.6; relativeHeightInput.value = "1.6"; }
        const flatMode = flatModeCheck?.checked;
        let finalHeight = flatMode ? 1.6 : relH;

        let distance = parseFloat(distanceInput?.value) || 10;
        let pitch = Math.abs(filteredPitch || 0);   // 取绝对值，向下为正计算距离
        const autoDist = autoDistanceCheck?.checked;

        if (autoDist && pitch > 5 && pitch < 85) {
            let pitchRad = Math.radians(pitch);
            let calcDist = finalHeight / Math.tan(pitchRad);
            if (calcDist > 0.5 && calcDist < 2000) {
                distance = calcDist;
                if (distanceInput) distanceInput.value = distance.toFixed(1);
            }
        }
        const halfW = distance * Math.tan(Math.radians(H_FOV/2));
        const halfH = distance * Math.tan(Math.radians(V_FOV/2));
        if (footprintSizeSpan) footprintSizeSpan.innerText = `${(halfW*2).toFixed(1)}m × ${(halfH*2).toFixed(1)}m`;
    }

    // ======================== 增强传感器融合（绝对事件/互补滤波） ========================
    async function initBestOrientationSensor() {
        // 移除旧的监听
        if (orientationHandler) window.removeEventListener('deviceorientation', orientationHandler);
        if (motionHandler) window.removeEventListener('devicemotion', motionHandler);
        if (window.absoluteHandler) window.removeEventListener('deviceorientationabsolute', window.absoluteHandler);

        // 尝试绝对事件（需要 iOS 授权，已在 startCamera 中处理 requestPermission）
        if (window.DeviceOrientationEvent && 'requestPermission' in DeviceOrientationEvent) {
            // 注意：requestPermission 必须在用户手势下调用，此处仅检测能力，实际授权已在 startCamera 中完成
            // 我们直接监听绝对事件
            window.absoluteHandler = (e) => {
                if (e.alpha === null) return;
                useAbsolute = true;
                rawAlpha = e.alpha;
                let alpha = e.alpha;          // 绝对磁北
                let beta = e.beta;             // -180~180，水平0，向上正
                // 镜头俯仰角 = -beta（向下为负）
                let pitch = -beta;
                pitch = Math.min(90, Math.max(-90, pitch));

                // 平滑方位角
                if (filteredCompass === null) filteredCompass = alpha;
                else {
                    let delta = alpha - filteredCompass;
                    if (delta > 180) delta -= 360;
                    if (delta < -180) delta += 360;
                    filteredCompass = normAngle(filteredCompass + SMOOTH * delta);
                }
                if (filteredPitch === null) filteredPitch = pitch;
                else filteredPitch = filteredPitch + SMOOTH * (pitch - filteredPitch);

                updateSensorUI();
            };
            window.addEventListener('deviceorientationabsolute', window.absoluteHandler);
            console.log("✅ 使用 deviceorientationabsolute");
            return;
        }

        // 降级：普通 deviceorientation + devicemotion 互补滤波
        useAbsolute = false;
        let lastTimestampGyro = 0;
        let gyroIntegral = null;

        orientationHandler = (e) => {
            let alpha = e.webkitCompassHeading || e.alpha;
            if (alpha === null) return;
            rawAlpha = alpha;
            let beta = e.beta;
            let pitch = -beta;
            pitch = Math.min(90, Math.max(-90, pitch));

            // 互补滤波融合陀螺仪（需要在 motion 中更新 gyroIntegral）
            const now = performance.now();
            if (lastTimestampGyro > 0 && gyroIntegral !== null) {
                let dt = Math.min(0.1, (now - lastTimestampGyro) / 1000);
                let predicted = gyroIntegral;
                let fused = COMP_FILTER * predicted + (1 - COMP_FILTER) * alpha;
                if (Math.abs(fused - predicted) > 180) fused += 360;
                filteredCompass = normAngle(fused);
            } else {
                filteredCompass = alpha;
            }
            // 平滑俯仰角
            if (filteredPitch === null) filteredPitch = pitch;
            else filteredPitch = filteredPitch + SMOOTH * (pitch - filteredPitch);
            lastTimestampGyro = now;
            updateSensorUI();
        };
        motionHandler = (e) => {
            if (!e.rotationRate || e.rotationRate.alpha === null) return;
            let alphaRate = e.rotationRate.alpha;   // deg/s
            let now = performance.now();
            if (lastTimestampGyro > 0 && filteredCompass !== null) {
                let dt = Math.min(0.05, (now - lastTimestampGyro) / 1000);
                let delta = alphaRate * dt;
                if (gyroIntegral === null) gyroIntegral = filteredCompass;
                gyroIntegral = normAngle(gyroIntegral + delta);
            }
            lastTimestampGyro = now;
        };
        window.addEventListener('deviceorientation', orientationHandler);
        window.addEventListener('devicemotion', motionHandler);
        console.log("⚠️ 使用 deviceorientation + gyro 互补滤波");
    }

    // 8字校准：重置滤波器
    function startCalibration() {
        filteredCompass = null;
        filteredPitch = null;
        gyroIntegral = null;
        lastTimestampGyro = 0;
        updateStatus("正在校准，请平放手机画横向8字持续10秒...", "info");
        setTimeout(() => {
            updateStatus("校准完成，方向数据将更准确", "success");
        }, 10000);
        if (navigator.vibrate) navigator.vibrate(200);
        alert("📡 请将手机平放，在空中缓慢画横向“8”字，持续10秒...");
    }

    // ======================== 摄像头与权限 ========================
    async function startCamera() {
        try {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }
            const constraints = { video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } };
            cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoEl.srcObject = cameraStream;
            videoEl.style.display = 'block';
            startBtn.style.display = 'none';
            captureBtn.style.display = 'block';
            uploadBtn.style.display = 'none';

            // iOS 传感器授权（必须在用户手势回调中）
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm === 'granted') {
                        await initBestOrientationSensor();
                        document.getElementById('sensorData').style.display = 'block';
                        document.getElementById('footprintSettings').style.display = 'block';
                        calibrateBtn.style.display = 'block';
                        updateStatus("传感器权限已授予", "success");
                    } else {
                        updateStatus("传感器权限被拒，方位角不可用", "error");
                    }
                } catch (err) {
                    console.error(err);
                    updateStatus("传感器授权失败", "error");
                }
            } else {
                // Android 直接初始化
                await initBestOrientationSensor();
                document.getElementById('sensorData').style.display = 'block';
                document.getElementById('footprintSettings').style.display = 'block';
                calibrateBtn.style.display = 'block';
                updateStatus("传感器已启动（Android）", "success");
            }
            // 获取一次位置
            getRealTimeLocation();
        } catch (err) {
            console.error(err);
            updateStatus("摄像头启动失败: " + err.message, "error");
        }
    }

    // GPS 定位
    function getRealTimeLocation() {
        if (!navigator.geolocation) {
            alert("浏览器不支持GPS");
            return;
        }
        updateStatus("正在获取GPS位置...", "info");
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                latitudeInput.value = currentLat.toFixed(6);
                longitudeInput.value = currentLon.toFixed(6);
                const alt = pos.coords.altitude;
                if (alt && !flatModeCheck.checked) {
                    let finalAlt = alt;
                    if (finalAlt < 1) finalAlt = 1.6;
                    relativeHeightInput.value = finalAlt.toFixed(1);
                    if (gpsAltSpan) gpsAltSpan.innerText = finalAlt.toFixed(1) + "m";
                    if (altitudeHint) altitudeHint.innerText = `GPS海拔: ${alt.toFixed(1)}m → 使用${finalAlt.toFixed(1)}m`;
                } else {
                    if (gpsAltSpan) gpsAltSpan.innerText = "无效";
                    if (altitudeHint) altitudeHint.innerText = "GPS海拔无效，使用手动高度";
                }
                updateStatus("GPS定位成功", "success");
                computeAndUpdateFootprint();
            },
            (err) => {
                console.error(err);
                updateStatus("GPS定位失败: " + err.message, "error");
                if (gpsAltSpan) gpsAltSpan.innerText = "获取失败";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // 拍照
    function capturePhoto() {
        if (!videoEl || !videoEl.videoWidth || !videoEl.srcObject) {
            alert("请先启动摄像头");
            return;
        }
        if (currentLat === 0 || currentLon === 0) {
            alert("请先获取GPS位置");
            return;
        }
        const azimuth = filteredCompass;
        const pitch = filteredPitch;
        const relHeight = parseFloat(relativeHeightInput.value) || 1.6;
        const canvas = document.createElement('canvas');
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        capturedPhoto = canvas.toDataURL('image/jpeg', 0.9);
        capturedParams = {
            latitude: currentLat,
            longitude: currentLon,
            azimuth: azimuth,
            pitch: pitch,
            relativeHeight: relHeight,
            h_fov: H_FOV,
            v_fov: V_FOV
        };
        // 显示预览
        photoPreview.src = capturedPhoto;
        photoPreview.style.display = 'block';
        paramsDiv.style.display = 'block';
        paramsDiv.innerHTML = `
            <div style="font-weight:600; margin-bottom:6px;">📊 拍照参数</div>
            <div>📍 位置: ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}</div>
            <div>🧭 方位角: ${azimuth?.toFixed(1) || '?'}°</div>
            <div>📐 俯仰角: ${pitch?.toFixed(1) || '?'}°</div>
            <div>📏 相对高度: ${relHeight}m</div>
            <div>📷 视场角: ${H_FOV}° × ${V_FOV}°</div>
        `;
        captureBtn.style.display = 'none';
        uploadBtn.style.display = 'block';
        videoEl.style.display = 'none';
        updateStatus("拍照完成，可上传", "success");
    }

    // 上传照片
    async function uploadPhoto() {
        if (!capturedPhoto || !capturedParams) {
            alert("没有可上传的照片，请先拍照");
            return;
        }
        const { latitude, longitude, azimuth, pitch, relativeHeight, h_fov, v_fov } = capturedParams;
        const username = localStorage.getItem('username') || 'anonymous';
        const problemType = problemTypeSelect?.value || '';
        const captureTime = new Date().toISOString();

        // 转换 base64 为 blob
        let blob;
        try {
            blob = await fetch(capturedPhoto).then(r => r.blob());
        } catch(e) {
            alert("照片转换失败");
            return;
        }
        const file = new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
        const formData = new FormData();
        formData.append('files', file);
        formData.append('username', username);
        formData.append('latitude', latitude);
        formData.append('longitude', longitude);
        formData.append('capture_time', captureTime);
        const hasValidOrientation = (azimuth !== null && !isNaN(azimuth) && pitch !== null && !isNaN(pitch));
        const deviceType = hasValidOrientation ? 'phone-footprint' : 'phone';
        formData.append('device_type', deviceType);
        formData.append('yaw', azimuth || 0);
        formData.append('pitch', pitch || 0);
        formData.append('relative_height', relativeHeight);
        formData.append('h_fov', h_fov);
        formData.append('v_fov', v_fov);
        if (problemType) formData.append('problem_type', problemType);

        const apiUrl = 'https://lzy-fastapi.onrender.com/api/upload';
        updateStatus("上传中...", "info");
        try {
            const response = await fetch(apiUrl, { method: 'POST', body: formData });
            if (response.ok) {
                const result = await response.json();
                const successCount = result.success || 0;
                const failedCount = result.failed || 0;
                alert(`上传成功！\n成功: ${successCount} 张\n失败: ${failedCount} 张`);
                updateStatus("上传完成，数据已同步", "success");
                // 重置界面
                resetAfterUpload();
            } else {
                let errMsg = `HTTP ${response.status}`;
                try { const txt = await response.text(); errMsg = txt.substring(0, 200); } catch(e) {}
                alert("上传失败: " + errMsg);
                updateStatus("上传失败", "error");
            }
        } catch (err) {
            alert("网络错误: " + err.message);
            updateStatus("上传异常", "error");
        }
    }

    function resetAfterUpload() {
        capturedPhoto = null;
        capturedParams = null;
        photoPreview.style.display = 'none';
        paramsDiv.style.display = 'none';
        uploadBtn.style.display = 'none';
        captureBtn.style.display = 'block';
        videoEl.style.display = 'block';
        // 可选重新获取位置
        getRealTimeLocation();
    }

    // ======================== 初始化事件绑定 ========================
    function bindEvents() {
        startBtn = document.getElementById('startCameraBtn');
        captureBtn = document.getElementById('capturePhotoBtn');
        uploadBtn = document.getElementById('uploadPhotoBtn');
        videoEl = document.getElementById('cameraPreview');
        compassSpan = document.getElementById('compassValue');
        pitchSpan = document.getElementById('pitchValue');
        rawAlphaSpan = document.getElementById('rawAlphaValue');
        latitudeInput = document.getElementById('latitude');
        longitudeInput = document.getElementById('longitude');
        relativeHeightInput = document.getElementById('relativeHeightInput');
        flatModeCheck = document.getElementById('flatModeCheck');
        autoDistanceCheck = document.getElementById('autoDistanceCheck');
        distanceInput = document.getElementById('distanceInput');
        footprintSizeSpan = document.getElementById('footprintSize');
        calibrateBtn = document.getElementById('calibrateBtn');
        getLocationBtn = document.getElementById('getLocationBtn');
        altitudeHint = document.getElementById('altitudeHint');
        gpsAltSpan = document.getElementById('gpsAltDisplay');
        photoPreview = document.getElementById('capturedPhotoPreview');
        paramsDiv = document.getElementById('capturedParams');
        statusDiv = document.getElementById('statusMsg');
        problemTypeSelect = document.getElementById('problemTypeSelect');

        startBtn.addEventListener('click', startCamera);
        captureBtn.addEventListener('click', capturePhoto);
        uploadBtn.addEventListener('click', uploadPhoto);
        calibrateBtn.addEventListener('click', startCalibration);
        getLocationBtn.addEventListener('click', getRealTimeLocation);
        flatModeCheck.addEventListener('change', () => {
            if (flatModeCheck.checked) relativeHeightInput.value = "1.6";
            computeAndUpdateFootprint();
        });
        autoDistanceCheck.addEventListener('change', computeAndUpdateFootprint);
        relativeHeightInput.addEventListener('input', computeAndUpdateFootprint);
        distanceInput.addEventListener('input', computeAndUpdateFootprint);
        latitudeInput.addEventListener('change', () => {
            currentLat = parseFloat(latitudeInput.value);
            computeAndUpdateFootprint();
        });
        longitudeInput.addEventListener('change', () => {
            currentLon = parseFloat(longitudeInput.value);
            computeAndUpdateFootprint();
        });
    }

    // 页面启动
    window.addEventListener('DOMContentLoaded', () => {
        bindEvents();
        updateStatus("就绪，点击「启动摄像头」", "info");
    });
</script>
</body>
</html>
