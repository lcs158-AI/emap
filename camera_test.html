<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手机摄像头测试 - 精准方向测量</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 16px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        h1 {
            text-align: center;
            font-size: 1.6rem;
            color: #1f2d3d;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .section {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid #e4e7ed;
            border-radius: 20px;
            background-color: #fafcff;
        }
        
        .section h2 {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #1890ff;
            padding-left: 12px;
        }
        
        .parameter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 12px;
            background-color: white;
            border-radius: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .parameter label {
            font-weight: 600;
            color: #4a5568;
            min-width: 100px;
        }
        
        .parameter value, .parameter span {
            color: #1890ff;
            font-weight: 500;
        }
        
        input, select {
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            font-size: 14px;
            width: 130px;
            text-align: center;
            background: #fff;
        }
        
        button {
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 8px;
        }
        
        button:active {
            transform: scale(0.97);
            background-color: #0c73d4;
        }
        
        button.secondary {
            background-color: #52c41a;
        }
        
        button.warning {
            background-color: #fa8c16;
        }
        
        video {
            width: 100%;
            border-radius: 20px;
            background: #000;
            margin-top: 8px;
        }
        
        .status {
            padding: 10px;
            margin-top: 12px;
            border-radius: 40px;
            text-align: center;
            font-size: 0.85rem;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        
        .status.info {
            background: #e3f2fd;
            color: #0b5e9e;
        }
        
        #map {
            width: 100%;
            height: 360px;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid #e2e8f0;
        }
        
        .hint-text {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 8px;
            text-align: center;
        }
        
        .flex-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .flex-row button {
            flex: 1;
            margin-top: 0;
        }
        
        .badge {
            background: #f0f2f5;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            .parameter {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    <!-- OpenLayers 地图库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.2/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.5.2/dist/ol.js"></script>
</head>
<body>
<div class="container">
    <h1>📱 精准摄像头测量</h1>
    
    <!-- 摄像头预览区 -->
    <div class="section">
        <h2>📷 后置摄像头</h2>
        <video id="video" autoplay playsinline></video>
        <div class="flex-row">
            <button id="startCamera">🔘 启动摄像头</button>
            <button id="capture">📸 拍照 & 计算视域</button>
        </div>
        <div class="hint-text">※ 建议先点击「启动摄像头」并允许权限</div>
    </div>
    
    <!-- 传感器实时数据 -->
    <div class="section">
        <h2>🧭 实时方向（平滑后）</h2>
        <div class="parameter">
            <label>方位角（磁北 / 指南针风格）:</label>
            <value id="compassValue">-- °</value>
        </div>
        <div class="parameter">
            <label>俯仰角 (向下为正):</label>
            <value id="pitchValue">-- °</value>
        </div>
        <div class="parameter">
            <label>⚡ 原始真北 (仅供对比):</label>
            <value id="trueNorthValue">-- °</value>
        </div>
        <button id="calibrateBtn" class="warning">🔄 开始8字校准（传感器校正）</button>
        <div class="hint-text">※ 若与手机指南针App偏差＞5°，请执行8字校准</div>
    </div>
    
    <!-- 位置与高度参数 -->
    <div class="section">
        <h2>📍 位置 & 高度</h2>
        <div class="parameter">
            <label>纬度:</label>
            <input type="number" id="latitude" step="0.000001" value="31.2304" placeholder="纬度">
        </div>
        <div class="parameter">
            <label>经度:</label>
            <input type="number" id="longitude" step="0.000001" value="121.4737" placeholder="经度">
        </div>
        <div class="parameter">
            <label>相机相对高度 (米):</label>
            <input type="number" id="relativeHeight" step="0.1" value="1.6">
            <span id="altitudeHint" style="font-size:12px; color:#666;"></span>
        </div>
        <div class="parameter">
            <label>平地模式 (固定1.6m):</label>
            <input type="checkbox" id="flatMode">
        </div>
        <div class="flex-row">
            <button id="getLocationBtn">📍 获取GPS位置</button>
        </div>
    </div>
    
    <!-- 视域计算参数 -->
    <div class="section">
        <h2>📐 视域计算</h2>
        <div class="parameter">
            <label>水平视场角:</label>
            <value id="hFovLabel">78°</value>
        </div>
        <div class="parameter">
            <label>垂直视场角:</label>
            <value id="vFovLabel">43°</value>
        </div>
        <div class="parameter">
            <label>拍摄距离 (米):</label>
            <input type="number" id="distance" step="1" value="10">
            <span style="font-size:12px;">(自动计算时覆盖)</span>
        </div>
        <div class="parameter">
            <label>自动计算距离:</label>
            <input type="checkbox" id="autoDistance" checked>
        </div>
        <div class="parameter">
            <label>视域范围 (宽×高):</label>
            <value id="footprintSize">--</value>
        </div>
        <div class="parameter">
            <label>梯形坐标预览:</label>
            <div id="footprintCoords" style="font-size: 10px; word-break: break-all; color:#4b5563;">--</div>
        </div>
    </div>
    
    <!-- 地图展示视域 -->
    <div class="section">
        <h2>🗺️ 地图视域（磁北方向）</h2>
        <div id="map"></div>
    </div>
    
    <div id="statusMsg" class="status info">✅ 准备就绪，请启动摄像头并授权传感器</div>
</div>

<script>
    // ======================== 全局变量 ========================
    let videoStream = null;
    let map = null;
    let footprintLayer = null;
    let positionMarker = null;
    
    // 平滑滤波器变量
    let filteredCompass = null;      // 最终显示给用户的磁北方位角(0-360)
    let filteredPitch = null;
    let rawTrueNorth = 0;            // 原始alpha (真北)
    let currentDeclination = 0;      // 磁偏角 (度), 正东偏
    let lastLat = 31.2304;
    let lastLon = 121.4737;
    
    const SMOOTHING_FACTOR = 0.2;     // 平滑系数
    const H_FOV = 78;                 // 水平视场角 (度)
    const V_FOV = 43;                 // 垂直视场角 (度)
    
    let isCalibrating = false;        // 8字校准模式标志
    
    // DOM 元素
    const videoEl = document.getElementById('video');
    const startBtn = document.getElementById('startCamera');
    const captureBtn = document.getElementById('capture');
    const compassSpan = document.getElementById('compassValue');
    const pitchSpan = document.getElementById('pitchValue');
    const trueNorthSpan = document.getElementById('trueNorthValue');
    const latitudeInput = document.getElementById('latitude');
    const longitudeInput = document.getElementById('longitude');
    const relativeHeightInput = document.getElementById('relativeHeight');
    const flatModeCheck = document.getElementById('flatMode');
    const autoDistanceCheck = document.getElementById('autoDistance');
    const distanceInput = document.getElementById('distance');
    const footprintSizeSpan = document.getElementById('footprintSize');
    const footprintCoordsDiv = document.getElementById('footprintCoords');
    const statusDiv = document.getElementById('statusMsg');
    
    // ======================== 辅助函数 ========================
    function updateStatus(text, type = 'info') {
        statusDiv.textContent = text;
        statusDiv.className = `status ${type}`;
        console.log(`[Status] ${text}`);
    }
    
    // 角度转弧度
    Math.radians = (deg) => deg * Math.PI / 180;
    Math.degrees = (rad) => rad * 180 / Math.PI;
    
    // 正常化角度 0-360
    function normalizeAngle(angle) {
        angle = angle % 360;
        if (angle < 0) angle += 360;
        return angle;
    }
    
    // 近似磁偏角（简易模型）
    function getApproxDeclination(lat, lon) {
        let dec = 5.0;
        if (lon > 110 && lat > 30) dec = 5.5;
        else if (lon > 100 && lat > 25) dec = 4.5;
        else if (lon < 100) dec = 2.0;
        return dec;
    }
    
    async function fetchTrueDeclination(lat, lon) {
        try {
            const approx = getApproxDeclination(lat, lon);
            console.log(`磁偏角近似值: ${approx}° (真北→磁北需减去${approx})`);
            return approx;
        } catch(e) {
            return getApproxDeclination(lat, lon);
        }
    }
    
    async function updateDeclination(lat, lon) {
        currentDeclination = await fetchTrueDeclination(lat, lon);
        if (rawTrueNorth !== null) {
            const magnetic = normalizeAngle(rawTrueNorth - currentDeclination);
            filteredCompass = magnetic;
            if (compassSpan) compassSpan.innerText = filteredCompass.toFixed(1) + "°";
        }
    }
    
    // 处理设备方向事件 (平滑 + 磁偏角校正)
    let orientationHandler = null;
    function startOrientationListener() {
        if (orientationHandler) window.removeEventListener('deviceorientation', orientationHandler);
        orientationHandler = (event) => {
            if (event.alpha === null || event.beta === null) {
                return;
            }
            let rawAlpha = event.alpha;
            rawTrueNorth = rawAlpha;
            let rawPitch = event.beta;
            
            // 平滑方位角 (处理边界)
            if (filteredCompass === null) {
                let initMagnetic = normalizeAngle(rawAlpha - currentDeclination);
                filteredCompass = initMagnetic;
            } else {
                let instantMagnetic = normalizeAngle(rawAlpha - currentDeclination);
                let delta = instantMagnetic - filteredCompass;
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;
                filteredCompass = normalizeAngle(filteredCompass + SMOOTHING_FACTOR * delta);
            }
            
            // 平滑俯仰角
            if (filteredPitch === null) filteredPitch = rawPitch;
            else filteredPitch += SMOOTHING_FACTOR * (rawPitch - filteredPitch);
            
            // 更新UI
            if (compassSpan) compassSpan.innerText = filteredCompass.toFixed(1) + "°";
            if (pitchSpan) pitchSpan.innerText = filteredPitch.toFixed(1) + "°";
            if (trueNorthSpan) trueNorthSpan.innerText = rawTrueNorth.toFixed(1) + "°";
            
            // 每次重新计算视域
            calculateFootprint();
        };
        window.addEventListener('deviceorientation', orientationHandler);
        console.log("方向监听已启动");
    }
    
    // ======================== 8字校准 ========================
    function startCalibrationGuide() {
        if (isCalibrating) return;
        isCalibrating = true;
        updateStatus("✋ 请将手机平放，在空中缓慢画横向“8”字，持续10秒...", "info");
        filteredCompass = null;
        filteredPitch = null;
        setTimeout(() => {
            isCalibrating = false;
            updateStatus("校准完成！传感器数据将更准确。", "success");
            const lat = parseFloat(latitudeInput.value);
            const lon = parseFloat(longitudeInput.value);
            updateDeclination(lat, lon);
        }, 10000);
        if (navigator.vibrate) navigator.vibrate(200);
    }
    
    // ======================== 摄像头启动 ========================
    async function startCamera() {
        try {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
            };
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoEl.srcObject = videoStream;
            updateStatus("后置摄像头已启动", "success");
            await requestSensorPermission();
            startOrientationListener();
        } catch (err) {
            console.error(err);
            updateStatus("摄像头启动失败，请检查权限或使用后置摄像头: " + err.message, "error");
        }
    }
    
    async function requestSensorPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permissionState = await DeviceOrientationEvent.requestPermission();
                if (permissionState === 'granted') {
                    updateStatus("设备方向权限已授予", "success");
                } else {
                    updateStatus("传感器权限被拒绝，方位角可能不准", "error");
                }
            } catch (err) {
                console.warn(err);
            }
        } else {
            updateStatus("传感器已就绪 (Android)", "success");
        }
    }
    
    // ======================== 位置获取 ========================
    function getRealTimeLocation() {
        if (!navigator.geolocation) {
            updateStatus("浏览器不支持GPS", "error");
            return;
        }
        updateStatus("正在获取GPS位置...", "info");
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                latitudeInput.value = lat.toFixed(6);
                longitudeInput.value = lon.toFixed(6);
                lastLat = lat;
                lastLon = lon;
                const alt = pos.coords.altitude;
                if (alt && !flatModeCheck.checked) {
                    relativeHeightInput.value = alt.toFixed(1);
                    document.getElementById('altitudeHint').innerText = `GPS海拔: ${alt.toFixed(1)}米`;
                } else {
                    document.getElementById('altitudeHint').innerText = `GPS获取海拔失败，使用手动高度`;
                }
                updateStatus("位置更新成功", "success");
                updateDeclination(lat, lon);
                calculateFootprint();
            },
            (err) => {
                updateStatus("GPS定位失败: " + err.message, "error");
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }
    
    // ======================== 拍照 ========================
    async function capturePhoto() {
        if (!videoEl.videoWidth || !videoEl.srcObject) {
            updateStatus("请先启动摄像头", "error");
            return;
        }
        const currentMagnetic = filteredCompass;
        const currentPitch = filteredPitch;
        const lat = parseFloat(latitudeInput.value);
        const lon = parseFloat(longitudeInput.value);
        const height = parseFloat(relativeHeightInput.value);
        let info = `📸 拍照时刻参数:\n方位角(磁北): ${currentMagnetic?.toFixed(1) || '?'}°\n俯仰角: ${currentPitch?.toFixed(1) || '?'}°\n`;
        info += `位置: ${lat.toFixed(5)}, ${lon.toFixed(5)}\n相对高度: ${height} m\n`;
        alert(info + "视域已自动计算并显示在地图");
        const canvas = document.createElement('canvas');
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        const link = document.createElement('a');
        link.download = `camera_${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
        updateStatus("拍照成功，图片已保存，视域已更新", "success");
    }
    
    // ======================== 视域计算 ========================
    function calculateFootprint() {
        const lat = parseFloat(latitudeInput.value);
        const lon = parseFloat(longitudeInput.value);
        const relHeight = parseFloat(relativeHeightInput.value);
        const flatMode = flatModeCheck.checked;
        const finalHeight = flatMode ? 1.6 : relHeight;
        const autoDist = autoDistanceCheck.checked;
        let distance = parseFloat(distanceInput.value);
        let pitch = filteredPitch || 0;
        if (autoDist && pitch > 5 && pitch < 85) {
            const pitchRad = Math.radians(Math.abs(pitch));
            const calcDist = finalHeight / Math.tan(pitchRad);
            if (calcDist > 0.5 && calcDist < 2000) {
                distance = calcDist;
                distanceInput.value = distance.toFixed(1);
            }
        }
        const halfWidth = distance * Math.tan(Math.radians(H_FOV/2));
        const halfHeight = distance * Math.tan(Math.radians(V_FOV/2));
        const widthM = halfWidth * 2;
        const heightM = halfHeight * 2;
        footprintSizeSpan.innerText = `${widthM.toFixed(1)}m × ${heightM.toFixed(1)}m`;
        
        let azimuthDeg = filteredCompass;
        if (azimuthDeg === null) azimuthDeg = 0;
        const azimuthRad = Math.radians(azimuthDeg);
        const pitchRad = Math.radians(Math.abs(pitch));
        
        const horizDistance = distance * Math.cos(pitchRad);
        const leftAngleOffset = -Math.radians(H_FOV/2);
        const rightAngleOffset = Math.radians(H_FOV/2);
        
        const leftFront = getPointAtDistanceBearing(lat, lon, horizDistance, azimuthDeg + Math.degrees(leftAngleOffset));
        const rightFront = getPointAtDistanceBearing(lat, lon, horizDistance, azimuthDeg + Math.degrees(rightAngleOffset));
        const leftBack = getPointAtDistanceBearing(lat, lon, horizDistance * 0.5, azimuthDeg + Math.degrees(leftAngleOffset) + 180);
        const rightBack = getPointAtDistanceBearing(lat, lon, horizDistance * 0.5, azimuthDeg + Math.degrees(rightAngleOffset) + 180);
        
        let polyCoords = [leftFront, rightFront, rightBack, leftBack, leftFront];
        footprintCoordsDiv.innerText = polyCoords.map(p => `[${p[1].toFixed(5)},${p[0].toFixed(5)}]`).join(' ');
        updateMapPolygon(polyCoords, lon, lat);
    }
    
    function getPointAtDistanceBearing(lat, lon, distM, bearingDeg) {
        const R = 6371000;
        const φ1 = Math.radians(lat);
        const λ1 = Math.radians(lon);
        const θ = Math.radians(bearingDeg);
        const δ = distM / R;
        const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
        const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
        return [Math.degrees(λ2), Math.degrees(φ2)];
    }
    
    function updateMapPolygon(coordsLngLat, centerLon, centerLat) {
        if (!map || !footprintLayer) return;
        footprintLayer.getSource().clear();
        const transformedCoords = coordsLngLat.map(p => ol.proj.fromLonLat(p));
        const poly = new ol.geom.Polygon([transformedCoords]);
        const feature = new ol.Feature(poly);
        footprintLayer.getSource().addFeature(feature);
        positionMarker.getSource().clear();
        const marker = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([centerLon, centerLat])) });
        positionMarker.getSource().addFeature(marker);
        map.getView().setCenter(ol.proj.fromLonLat([centerLon, centerLat]));
        map.getView().setZoom(17);
    }
    
    // ======================== 初始化地图 ========================
    function initMap() {
        map = new ol.Map({
            target: 'map',
            layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
            view: new ol.View({ center: ol.proj.fromLonLat([121.4737, 31.2304]), zoom: 16 })
        });
        footprintLayer = new ol.layer.Vector({
            source: new ol.source.Vector(),
            style: new ol.style.Style({
                fill: new ol.style.Fill({ color: 'rgba(255,80,40,0.35)' }),
                stroke: new ol.style.Stroke({ color: '#ff4d4f', width: 2 })
            })
        });
        positionMarker = new ol.layer.Vector({
            source: new ol.source.Vector(),
            style: new ol.style.Style({
                image: new ol.style.Circle({ radius: 8, fill: new ol.style.Fill({ color: '#1e88e5' }), stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) })
            })
        });
        map.addLayer(footprintLayer);
        map.addLayer(positionMarker);
    }
    
    // ======================== 事件绑定 ========================
    function bindEvents() {
        startBtn.addEventListener('click', startCamera);
        captureBtn.addEventListener('click', capturePhoto);
        document.getElementById('getLocationBtn').addEventListener('click', getRealTimeLocation);
        document.getElementById('calibrateBtn').addEventListener('click', startCalibrationGuide);
        flatModeCheck.addEventListener('change', () => {
            if (flatModeCheck.checked) relativeHeightInput.value = '1.6';
            calculateFootprint();
        });
        autoDistanceCheck.addEventListener('change', calculateFootprint);
        latitudeInput.addEventListener('change', () => {
            const lat = parseFloat(latitudeInput.value);
            const lon = parseFloat(longitudeInput.value);
            updateDeclination(lat, lon);
            calculateFootprint();
        });
        longitudeInput.addEventListener('change', () => {
            const lat = parseFloat(latitudeInput.value);
            const lon = parseFloat(longitudeInput.value);
            updateDeclination(lat, lon);
            calculateFootprint();
        });
        relativeHeightInput.addEventListener('input', calculateFootprint);
        distanceInput.addEventListener('input', calculateFootprint);
    }
    
    // 页面启动
    (function init() {
        initMap();
        bindEvents();
        document.getElementById('hFovLabel').innerText = H_FOV + "°";
        document.getElementById('vFovLabel').innerText = V_FOV + "°";
        setTimeout(() => {
            getRealTimeLocation();
        }, 500);
        updateStatus("点击上方启动摄像头并允许传感器权限", "info");
    })();
</script>
</body>
</html>
