<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>北津港潮汐测试</title>
</head>
<body>
    <h1>北津港潮汐查询测试</h1>
    <p>当前日期: <span id="today"></span></p>
    <p>站点: p2314 (北津)</p>
    <p>密钥: ebd9161a4eda4f3ebbcc3f3977d64820</p>
    <p>
        <a id="apiLink" href="#" target="_blank" style="font-size: 18px; background: #1890ff; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px;">🔗 在新窗口打开API</a>
    </p>
    <div style="margin-top: 20px;">
        <button id="fetchBtn" style="font-size: 16px; padding: 8px 16px;">📥 使用fetch获取数据（可能因CORS失败）</button>
    </div>
    <pre id="result" style="margin-top:20px; border:1px solid #ccc; padding:10px; min-height:100px; background: #f5f5f5;">结果将显示在这里</pre>

    <script>
        // 计算当前日期 YYYYMMDD
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const dateStr = `${year}${month}${day}`;
        document.getElementById('today').innerText = dateStr;

        // 构建API URL
        const baseUrl = `https://mg2tupq435.re.qweatherapi.com/v7/ocean/tide?location=p2314&date=${dateStr}&key=ebd9161a4eda4f3ebbcc3f3977d64820`;
        const apiLink = document.getElementById('apiLink');
        apiLink.href = baseUrl;

        // fetch按钮点击事件
        document.getElementById('fetchBtn').addEventListener('click', function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = '正在请求...';
            fetch(baseUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    resultDiv.innerText = `请求失败: ${error.message}\n\n如果是因为跨域（CORS）问题，请直接点击上面的链接在新窗口查看。`;
                });
        });
    </script>
</body>
</html>
